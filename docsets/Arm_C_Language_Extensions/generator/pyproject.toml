[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "arm-acle-docset"
version = "0.1.0"
description = "Reproducible generator for the Arm C Language Extensions Dash docset"
requires-python = "==3.14.2"
dependencies = [
  "Jinja2>=3.1,<4",
  "markdown-it-py>=3,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
